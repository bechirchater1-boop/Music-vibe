
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIC VIBE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:white;font-family:Arial,sans-serif}
header{padding:25px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252535}
.logo{font-size:27px;font-weight:bold;color:#b45cff}
.logo span{color:white}
.hero{text-align:center;padding:65px 15px 35px}
.hero h1{font-size:48px;margin:10px}
.hero h1 span{color:#b45cff}
.hero p{color:#aaa}
.search{margin:25px auto;max-width:500px}
input{width:100%;padding:16px;border-radius:30px;border:1px solid #7541a5;background:#171421;color:white;font-size:16px;outline:none}
main{max-width:1000px;margin:auto;padding:20px}
h2{color:#d5a4ff}
.songs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.song{background:#171421;padding:18px;border-radius:15px;border:1px solid #29213a}
.cover{height:120px;border-radius:10px;background:linear-gradient(135deg,#37105f,#a34cff);display:grid;place-items:center;font-size:45px}
.song h3{margin-bottom:5px}
.song p{color:#aaa;font-size:13px}
button{background:#a34cff;color:white;border:0;padding:11px 18px;border-radius:25px;cursor:pointer}
footer{text-align:center;padding:30px;color:#777}
#player{position:sticky;bottom:0;background:#171421;padding:15px;text-align:center;border-top:1px solid #7541a5}
</style>
</head>
<body>
<header>
<div class="logo">MUSIC <span>VIBE</span></div>
<div>🎧 YOUR MUSIC WORLD</div>
</header>
<section class="hero">
<h1>FEEL THE <span>MUSIC</span></h1>
<p>Discover your vibe. Play your favorite music.</p>
<div class="search">
<input id="search" placeholder="🔍 Search music..." oninput="filterSongs()">
</div>
</section>
<main>
<h2>🔥 Discover Music</h2>
<div class="songs" id="songs">
<div class="song" data-name="chill vibes">
<div class="cover">🌙</div>
<h3>Chill Vibes</h3><p>Relax & Feel the Music</p>
<button onclick="playSong('Chill Vibes','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">▶ Play</button>
</div>
<div class="song" data-name="night music">
<div class="cover">🌃</div>
<h3>Night Music</h3><p>Music for the Night</p>
<button onclick="playSong('Night Music','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">▶ Play</button>
</div>
<div class="song" data-name="dream vibes">
<div class="cover">✨</div>
<h3>Dream Vibes</h3><p>Relax Your Mind</p>
<button onclick="playSong('Dream Vibes','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3')">▶ Play</button>
</div>
</div>
</main>
<div id="player">
<div id="now">Choose a song 🎵</div>
<audio id="audio" controls style="width:90%;max-width:500px"></audio>
</div>
<footer>© 2026 MUSIC VIBE | Feel every beat ❤️</footer>
<script>
function playSong(name,url){
document.getElementById('now').textContent='Playing: '+name;
let a=document.getElementById('audio');
a.src=url;
a.play();
}
function filterSongs(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.song').forEach(s=>{
s.style.display=s.dataset.name.includes(q)?'block':'none';
});
}
</script>
</body>
</html>
