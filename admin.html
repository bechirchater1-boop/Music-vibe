<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090811"><title>Admin | MUSIC VIBE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090811;color:#fff;font:15px Arial,sans-serif;padding:24px}main{max-width:760px;margin:40px auto}.brand{color:#c084fc;font-weight:900;letter-spacing:2px}.panel{background:#15121e;border:1px solid #392849;border-radius:18px;padding:22px;margin:18px 0}h1{font-size:30px}label{display:block;color:#cbbbd8;margin:14px 0 6px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #49365e;background:#0e0c14;color:white}button{padding:12px 18px;border:0;border-radius:10px;background:#9333ea;color:white;font-weight:bold;cursor:pointer;margin-top:14px}.secondary{background:#30243e}.video{border-top:1px solid #382b48;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#aaa;font-size:13px}.hidden{display:none}.danger{background:#7f1d1d}a{color:#d8b4fe}#message{color:#d8b4fe;min-height:22px}
</style></head><body><main><div class="brand">MUSIC VIBE / BACKOFFICE</div><h1>Gestion des vidéos</h1><p class="muted">Connecte-toi pour ajouter et gérer les liens affichés sur la page d'accueil.</p>
<section id="login" class="panel"><h2>Connexion admin</h2><form id="loginForm"><label>Mot de passe administrateur</label><input id="password" type="password" required autocomplete="current-password"><button>Se connecter</button></form></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>Ajouter une vidéo</h2><form id="addForm"><label>Titre de la vidéo</label><input id="title" placeholder="Ex : Nouveau clip tunisien" required maxlength="120"><label>Lien vidéo (YouTube, Vimeo ou autre URL)</label><input id="url" type="url" placeholder="https://..." required><label>Catégorie</label><input id="category" placeholder="Tunisian Rap" maxlength="60"><button>Ajouter le lien</button></form></div><div class="panel"><h2>Toutes les vidéos</h2><div id="videos"></div></div><button id="logout" class="secondary">Déconnexion</button></section><p id="message" role="status"></p><p class="muted"><a href="/">← Retour au site</a></p></main>
<script>
const $=id=>document.getElementById(id);const message=t=>$("message").textContent=t;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erreur serveur");return d}
function showAdmin(on){$("login").classList.toggle("hidden",on);$("dashboard").classList.toggle("hidden",!on)}
async function load(){const d=await api("/api/videos");$("videos").innerHTML="";if(!d.videos.length){$("videos").textContent="Aucune vidéo pour le moment.";return}for(const v of d.videos){const row=document.createElement("div");row.className="video";const info=document.createElement("div");const strong=document.createElement("strong");strong.textContent=v.title;const small=document.createElement("div");small.className="muted";small.textContent=v.category+" · "+v.url;info.append(strong,small);const del=document.createElement("button");del.className="danger";del.textContent="Supprimer";del.onclick=async()=>{if(!confirm("Supprimer cette vidéo ?"))return;try{await api("/api/admin/videos/"+v.id,{method:"DELETE"});await load();message("Vidéo supprimée.")}catch(e){message(e.message)}};row.append(info,del);$("videos").append(row)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});showAdmin(true);await load();message("Connexion réussie.")}catch(e){message(e.message)}};
$("addForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/videos",{method:"POST",body:JSON.stringify({title:$("title").value,url:$("url").value,category:$("category").value})});$("addForm").reset();await load();message("Lien ajouté avec succès.")}catch(e){message(e.message)}};
$("logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});showAdmin(false);message("Déconnecté.")};
(async()=>{try{await api("/api/admin/session");showAdmin(true);await load()}catch{showAdmin(false)}})();
</script></body></html>
